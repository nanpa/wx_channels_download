name: Windows Tkinter bundle

on:
  push:
    branches:
      - gui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go for the CI-built core
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"
          cache: true

      - name: Generate Windows resources
        shell: pwsh
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in .\build\winres.json --arch amd64

      - name: Test Go launcher integration
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go test ./cmd ./internal/application

      - name: Build Go core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\python_gui\core | Out-Null
          $env:CGO_ENABLED = "0"
          go build `
            -trimpath `
            -tags "with_gvisor,embed_inject,sqlite_only,embed_frontend_inject" `
            -ldflags "-s -w -X main.Mode=release" `
            -o .\python_gui\core\wx_channels_core.exe `
            .

      - name: Upload reusable Go core
        uses: actions/upload-artifact@v4
        with:
          name: wx_channels_core-windows-x86_64
          path: python_gui/core/wx_channels_core.exe
          if-no-files-found: error

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.12

      - name: Build Tkinter launcher
        shell: pwsh
        working-directory: python_gui
        env:
          WX_CHANNELS_GUI_VERSION: 0.94.${{ github.run_number }}
        run: .\build.ps1

      - name: Create distribution archive
        shell: pwsh
        run: Compress-Archive -Path .\python_gui\dist\WxChannelsDownload\* -DestinationPath .\WxChannelsDownload-windows-x86_64-v0.94.${{ github.run_number }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WxChannelsDownload-windows-x86_64-v0.94.${{ github.run_number }}
          path: WxChannelsDownload-windows-x86_64-v0.94.${{ github.run_number }}.zip
          if-no-files-found: error
